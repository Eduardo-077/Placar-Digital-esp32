<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placar</title>
<style>
  :root {
    --bg: #e9eef2; --ink: #14233a; --muted: #5a6b82; --card: #ffffff;
    --line: #c9d3de; --accent: #2457d6; --ok: #1e8449; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a2b; --ink: #e8eef6; --muted: #9fb0c6; --card: #17263d;
      --line: #2b3d58; --accent: #6c97ff; --ok: #4cd18a; --danger: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: "Bahnschrift", "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 16px; letter-spacing: .01em; }

  form { display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-weight: 700; }
  input, select {
    width: 100%; padding: 12px; font: inherit; font-size: 1.1rem; font-weight: 400;
    color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  }
  .times { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
  .x { font-size: 1.5rem; font-weight: 700; color: var(--muted); padding-bottom: 10px; }
  button {
    font: inherit; font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 14px;
    color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .msg { min-height: 1.4em; margin: 12px 0 0; font-weight: 700; }
  .msg.ok { color: var(--ok); }
  .msg.erro { color: var(--danger); }

  .atual {
    margin-top: 28px; padding: 14px; background: var(--card);
    border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 6px;
  }
  .atual span { display: block; color: var(--muted); font-size: .9rem; margin-bottom: 4px; }
  .atual strong { font-size: 1.25rem; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Placar</h1>

  <form id="form">
    <label>Modo
      <select id="modo">
        <option value="futebol">Futebol</option>
        <option value="basquete">Basquete</option>
        <option value="volei">Vôlei</option>
        <option value="tenis">Tênis</option>
        <option value="jiujitsu">Jiu-Jitsu</option>
        <option value="padel">Padel</option>
      </select>
    </label>

    <div class="times">
      <label>Time A
        <input id="time-a" type="text" maxlength="12" placeholder="CASA" autocomplete="off" required>
      </label>
      <span class="x">x</span>
      <label>Time B
        <input id="time-b" type="text" maxlength="12" placeholder="VISITANTE" autocomplete="off" required>
      </label>
    </div>

    <label>PIN
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
    </label>

    <button id="enviar" type="submit">Enviar para o placar</button>
  </form>
  <p class="msg" id="msg" role="status"></p>

  <div class="atual">
    <span>No placar agora</span>
    <strong id="atual">carregando...</strong>
  </div>
</main>

<script>
/* ============================================================
   CONFIGURAÇÃO DO SUPABASE (Project Settings -> API Keys)
   Use SÓ a chave anon/publishable, NUNCA a service_role/secret.
   Ela pode ficar aqui no HTML: quem protege o banco é o RLS + PIN.
   ============================================================ */
const SUPABASE_URL = "https://kihptngrzpewoheufjoo.supabase.co";
const SUPABASE_KEY = "sb_publishable_HSR9_8r5VStJaytpSUhH-A_G41npveU";
const PLACAR_ID = "placar01";

const cabecalhos = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

const NOMES_MODO = {
  futebol: "Futebol", basquete: "Basquete", volei: "Vôlei",
  tenis: "Tênis", jiujitsu: "Jiu-Jitsu", padel: "Padel"
};

// A fonte da tela do ESP não tem acentos: "Grêmio" vira "GREMIO"
function limparNome(nome) {
  return nome.normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toUpperCase();
}

// Traduz os erros do banco para algo legível
function traduzirErro(e) {
  const m = e.message || "";
  if (m.includes("PIN incorreto")) return "PIN incorreto.";
  if (m.includes("time_a")) return "Nome do time A inválido (1 a 12 letras).";
  if (m.includes("time_b")) return "Nome do time B inválido (1 a 12 letras).";
  if (m.includes("modo")) return "Modo inválido.";
  return "Erro: " + (m || "sem conexão com o servidor.");
}

async function enviarPartida(pin, modo, timeA, timeB) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/enviar_partida", {
    method: "POST",
    headers: cabecalhos,
    body: JSON.stringify({ p_pin: pin, p_modo: modo, p_time_a: timeA, p_time_b: timeB })
  });
  if (!r.ok) throw await r.json();
}

async function ultimaPartida() {
  const r = await fetch(SUPABASE_URL + "/rest/v1/partidas?placar_id=eq." + PLACAR_ID +
                        "&order=id.desc&limit=1", { headers: cabecalhos });
  if (!r.ok) throw await r.json();
  return (await r.json())[0];
}

/* ============================================================
   INTERFACE
   ============================================================ */
const $msg = document.getElementById("msg");
const $atual = document.getElementById("atual");
const $enviar = document.getElementById("enviar");

function mostrar(texto, tipo) {
  $msg.textContent = texto;
  $msg.className = "msg " + tipo;
}

async function atualizarAtual() {
  try {
    const p = await ultimaPartida();
    $atual.textContent = p ? NOMES_MODO[p.modo] + ": " + p.time_a + " x " + p.time_b : "nenhuma partida enviada";
  } catch (e) {
    $atual.textContent = "não foi possível carregar";
  }
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const timeA = limparNome(document.getElementById("time-a").value);
  const timeB = limparNome(document.getElementById("time-b").value);
  const modo = document.getElementById("modo").value;
  const pin = document.getElementById("pin").value;

  if (!timeA || !timeB) { mostrar("Preencha o nome dos dois times.", "erro"); return; }

  $enviar.disabled = true;
  mostrar("Enviando...", "");
  try {
    await enviarPartida(pin, modo, timeA, timeB);
    mostrar("Enviado! O placar muda em poucos segundos.", "ok");
    atualizarAtual();
  } catch (e) {
    mostrar(traduzirErro(e), "erro");
  }
  $enviar.disabled = false;
});

atualizarAtual();
</script>
</body>
</html>
